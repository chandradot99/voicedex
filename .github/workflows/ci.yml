name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra sync

      - name: Lint
        run: uvx ruff check .

      - name: Validate catalog data
        run: uv run python scripts/validate.py

      - name: Test
        run: uv run pytest -v
