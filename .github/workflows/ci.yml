name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra sync

      - name: Lint
        run: uvx ruff check .

      - name: Validate catalog data
        run: uv run python scripts/validate.py

      - name: Test
        run: uv run pytest -v

  # Deploy to Cloud Run after the checks pass on main. Auth is keyless (Workload Identity Federation);
  # the repo variables below are set once by the setup in docs/deploy.md.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGION: us-central1
      IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/voicedex/app:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: the /changes feed is built from git log of data/

      - uses: astral-sh/setup-uv@v4

      - name: Build changes feed from git history
        run: uv run --no-dev python scripts/build_changes.py   # -> data/.changes.json, copied into the image

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy
        run: |
          gcloud run deploy voicedex --image "$IMAGE" --region "$REGION" --quiet \
            --allow-unauthenticated --port 8000 \
            --min-instances 0 --max-instances 2 --cpu 1 --memory 512Mi \
            --cpu-boost --concurrency 80 \
            --set-env-vars "TRUST_CF_CONNECTING_IP=${{ vars.TRUST_CF_CONNECTING_IP || 'false' }}"

      - name: Smoke test
        run: |
          url=$(gcloud run services describe voicedex --region "$REGION" --format 'value(status.url)')
          curl -fsS "$url/health"
