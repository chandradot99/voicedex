{% extends "base.html" %}
{% block title %}Not found | {{ site_name }}{% endblock %}
{% block content %}
<section class="wrap page-head">
  <h1>Not found</h1>
  <p class="lede">{{ detail }}. It may have been renamed or retired by its provider.</p>
  <form class="search" action="/search" role="search">
    <label for="q" class="visually-hidden">Search providers, models and voices</label>
    <input id="q" name="q" type="search" placeholder="Search a provider, model or voice name…" autocomplete="off" spellcheck="false">
    <button type="submit">Search</button>
  </form>
  <p class="quick">Or browse <a href="/models">all models</a>, <a href="/voices">voices</a> or <a href="/#providers">providers</a>.</p>
</section>
{% endblock %}
