<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}Open catalog of speech-to-text, text-to-speech and speech-to-speech models and voices: languages, features, prices and status for every major provider.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/site.css">
  <script defer src="/static/site.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/" aria-label="{{ site_name }} home">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="9" width="3" height="6" rx="1.5"/><rect x="7" y="5" width="3" height="14" rx="1.5"/><rect x="12" y="2" width="3" height="20" rx="1.5"/><rect x="17" y="7" width="3" height="10" rx="1.5"/></svg>
        <span>{{ site_name }}</span>
      </a>
      <nav aria-label="Main">
        {% set path = request.url.path %}
        <a href="/models" {% if path.startswith('/models') %}aria-current="page"{% endif %}>Models</a>
        <a href="/voices" {% if path.startswith('/voices') %}aria-current="page"{% endif %}>Voices</a>
        <a href="/#providers" >Providers</a>
        <a href="/docs">API</a>
      </nav>
    </div>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap footer-row">
      <p>Data is pulled from each provider's API and documentation, reviewed, and versioned in git. Every page here is also available as JSON.</p>
      <p><a href="/docs">REST API</a> <a href="/v1/catalog.json">Download the full catalog</a></p>
    </div>
  </footer>
</body>
</html>
