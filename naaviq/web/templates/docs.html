<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API reference | {{ site_name }}</title>
  <meta name="description" content="Free, read-only REST API for speech-to-text, text-to-speech and speech-to-speech models and voices: languages, features, prices and shutdown dates.">
  <meta name="theme-color" content="#07080b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230b6e69'/%3E%3Crect x='4' y='10' width='2.4' height='4' rx='1.2' fill='white'/%3E%3Crect x='8.2' y='7' width='2.4' height='10' rx='1.2' fill='white'/%3E%3Crect x='12.4' y='4.5' width='2.4' height='15' rx='1.2' fill='white'/%3E%3Crect x='16.6' y='8.5' width='2.4' height='7' rx='1.2' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <!-- Site CSS goes into a low-priority cascade layer here: Scalar's styles live in layers declared
       later, so they win inside the reference (our button/heading rules must not leak into it), while
       the site header below still gets its look. -->
  <style>
    @layer site;
    @import url("/static/site.css") layer(site);
  </style>
  <style>
    body { min-height: 100vh; }
    .docs-header { position: sticky; top: 0; z-index: 100; padding: 12px 12px 10px; background: var(--bg); }
    #scalar-docs { --scalar-custom-header-height: 82px; }
  </style>
</head>
<body class="docs-page">
  <a class="skip" href="#scalar-docs">Skip to the reference</a>
  <header class="site-header docs-header">
    <div class="nav-pill">
      <a class="brand" href="/" aria-label="{{ site_name }} home">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="9" width="3" height="6" rx="1.5"/><rect x="7" y="5" width="3" height="14" rx="1.5"/><rect x="12" y="2" width="3" height="20" rx="1.5"/><rect x="17" y="7" width="3" height="10" rx="1.5"/></svg>
        <span>{{ site_name }}</span>
      </a>
      <nav class="nav-links" aria-label="Main">
        <a href="/models">Models</a>
        <a href="/voices">Voices</a>
        <a href="/#providers">Providers</a>
        <a href="/docs" aria-current="page">API</a>
      </nav>
      <a class="nav-cta" href="/v1/catalog.json">Download catalog</a>
    </div>
  </header>
  <main id="scalar-docs"></main>
  <script>
    // Focus rings for keyboard users only. Scalar moves focus programmatically after mouse clicks
    // (tabs, dropdown triggers), which browsers treat as :focus-visible — so track the input modality.
    (() => {
      const root = document.documentElement;
      addEventListener("pointerdown", () => root.classList.add("using-pointer"), true);
      addEventListener("keydown", (e) => { if (e.key === "Tab") root.classList.remove("using-pointer"); }, true);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.76.4/dist/browser/standalone.js"></script>
  <script>
    // Fill the real host into the quickstart examples and server list.
    fetch("/openapi.json").then((r) => r.text()).then((raw) => {
    const spec = JSON.parse(raw.replaceAll("https://<host>", location.origin));
    spec.servers = [{ url: location.origin, description: "This deployment" }];
    Scalar.createApiReference("#scalar-docs", {
      content: spec,
      theme: "none",
      darkMode: true,
      forceDarkModeState: "dark",
      hideDarkModeToggle: true,
      hideClientButton: true,        // the sidebar "Open API Client" opens client.scalar.com (external); in-page "Test Request" stays
      showDeveloperTools: "never",
      agent: { disabled: true },
      hideDownloadButton: false,
      documentDownloadType: "json",
      operationTitleSource: "summary",
      hideModels: true,         // OpenAPI schema list ("Models": ModelOut…) reads as speech models here
      orderSchemaPropertiesBy: "preserve",
      withDefaultFonts: false,
      defaultOpenAllTags: true,
      showSidebar: true,
      metaData: { title: "API reference | {{ site_name }}" },
      customCss: `
        .dark-mode, .light-mode, :root {
          --scalar-font: "Geist", ui-sans-serif, system-ui, sans-serif;
          --scalar-font-code: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
          --scalar-background-1: #07080b;
          --scalar-background-2: #11141a;
          --scalar-background-3: #171b23;
          --scalar-background-accent: rgba(94, 234, 212, 0.08);
          --scalar-color-1: #f2f4f7;
          --scalar-color-2: #c9ced8;
          --scalar-color-3: #8b93a3;
          --scalar-color-accent: #5eead4;
          --scalar-border-color: rgba(255, 255, 255, 0.11);
          --scalar-button-1: #f2f4f7;
          --scalar-button-1-color: #07080b;
          --scalar-button-1-hover: #ffffff;
          --scalar-color-green: #a3e635;
          --scalar-color-blue: #7fb4e0;
          --scalar-color-orange: #fbbf24;
          --scalar-color-red: #fb7c5c;
          --scalar-color-purple: #b79bf0;
          --scalar-radius: 10px;
          --scalar-radius-lg: 14px;
          --scalar-radius-xl: 22px;
          --scalar-sidebar-background-1: #07080b;
          --scalar-sidebar-item-hover-background: #11141a;
          --scalar-sidebar-item-active-background: #171b23;
          --scalar-sidebar-border-color: rgba(255, 255, 255, 0.08);
          --scalar-sidebar-color-1: #f2f4f7;
          --scalar-sidebar-color-2: #8b93a3;
          --scalar-sidebar-color-active: #5eead4;
          --scalar-sidebar-search-background: #11141a;
          --scalar-sidebar-search-border-color: rgba(255, 255, 255, 0.12);
        }
        .scalar-api-reference.references-layout { background: #07080b; }
        /* API client ("Test Request"): a raised panel over a dimmed, blurred page.
           !important: Scalar's own theme selectors are more specific than customCss. */
        .scalar-container.scalar-client--open { background: rgba(2, 3, 5, 0.72) !important; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .scalar.scalar-app.z-overlay { background: transparent !important; }
        .scalar-client.scalar-app-layout, .scalar-client.scalar-app-layout * {
          --scalar-background-1: #11141a !important;
          --scalar-background-2: #171b23 !important;
          --scalar-background-3: #1f2430 !important;
          --scalar-border-color: rgba(255, 255, 255, 0.12) !important;
        }
        .scalar-client.scalar-app-layout {
          background: #11141a !important; border: 1px solid rgba(255, 255, 255, 0.18) !important; border-radius: 22px; overflow: hidden;
          box-shadow: 0 40px 140px -20px rgba(0, 0, 0, 0.95), 0 0 80px -30px rgba(20, 184, 166, 0.35) !important;
        }
        .section-header, .section .section-header-label, h1.section-header { letter-spacing: -0.025em; }
        .introduction-section h1, .section-header.tight { font-weight: 600; }
        /* Floating layers (menus, listboxes, search dialog, tooltips) must read as raised above
           whatever they cover: lighter surface, visible edge, real shadow. */
        .z-context > div, [role="tooltip"], .scalar-modal {
          background: #1c212b !important;
          box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16), 0 24px 60px -12px rgba(0, 0, 0, 0.9) !important;
        }
        /* Search dialog (⌘K) and other modals: dim + blur the page; mark the keyboard selection. */
        .scalar-modal-layout { background: rgba(2, 3, 5, 0.72) !important; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .scalar-modal a[aria-selected="true"], .scalar-modal a:hover { background: #2a313e !important; box-shadow: inset 2px 0 0 #5eead4; }
        .z-context [role="option"]:hover, .z-context [role="option"][data-headlessui-state~="active"],
        .z-context [role="menuitem"]:hover { background: #2a313e !important; }
        .z-context [role="option"] .shadow-border, .z-context [role="menuitem"] .shadow-border { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.32) !important; }
        .z-context [role="option"][aria-selected="true"] .shadow-border { box-shadow: inset 0 0 0 1px #5eead4 !important; color: #5eead4 !important; }
        .z-context ul[role="listbox"] { border-color: rgba(255, 255, 255, 0.12) !important; }
        /* Intro "Client Libraries" card keeps Scalar's own design; only the focus ring Scalar leaves on a
           clicked tab is removed (keyboard focus still shows one). */
        html.using-pointer #scalar-docs *:focus, html.using-pointer .scalar-app *:focus { outline: 0 !important; }
        /* Intro "Client Libraries" card hidden: it duplicates the language picker on every code example, and
           the name suggests SDKs we don't publish. Bring it back if official packages ship. */
        .scalar-reference-intro-clients { display: none !important; }
        /* Server card hidden too: one fixed server; the base URL is in the quickstart and every example. */
        .scalar-reference-intro-server { display: none !important; }
        /* Sidebar, in the site's own pattern (top nav / tabs): active = rounded fill + white text, hover = a
           quieter fill, no accent bars. Scalar draws the nesting line inside each link, so the fill is a layer
           behind the text that starts right of that line for nested items instead of painting over it. */
        a.peer\\/button { position: relative; isolation: isolate; border-radius: 8px !important; padding: 7px 10px !important; background: transparent !important; box-shadow: none !important; }
        a.peer\\/button::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 8px; background: transparent; }
        a.peer\\/button:has(.scalar-sidebar-indent-border)::before { left: 24px; }
        /* Nested items: 10px between the fill's left edge and the text, same inset as group headings. */
        a.peer\\/button:has(.scalar-sidebar-indent-border) .group\\/button-label { padding-left: 4px; }
        a.peer\\/button:hover::before { background: #11141a; }
        a.peer\\/button[aria-current="page"]::before { background: #171b23; }
        a.peer\\/button:hover, a.peer\\/button[aria-current="page"] { color: #f2f4f7 !important; }
        a.peer\\/button[aria-current="page"] { font-weight: 500 !important; }
        .group\\/group-button > a.peer\\/button { color: #f2f4f7 !important; font-weight: 600 !important; }
        a.peer\\/button .sidebar-heading-type { opacity: 0.7; }
        /* Scalar overlays a brighter, offset segment on the nesting line beside the current item; the fill already
           marks it, so drop the segment and keep one continuous line. */
        .bg-sidebar-indent-border-active { display: none !important; }
        /* The line is drawn per item and the pieces overlap by a few px; a translucent colour doubles at each overlap
           (visible joints), so use the equivalent opaque colour. */
        .scalar-sidebar-indent-border { background: #1f2229 !important; width: 1px !important; }
        /* API client: larger section headings (Cookies, Headers, Query Parameters, Body…) and panel titles. */
        .scalar-client h3,
        .response-section-content button.box-content.max-h-8 { font-size: 15.5px !important; font-weight: 600 !important; line-height: 22px !important; }
        .scalar-client .request-response-header { font-size: 15px !important; font-weight: 600 !important; }
        /* Response panel: indent header/cookie keys to sit under their section titles,
           matching the request panel (whose rows start after a checkbox column). */
        .response-section-content .scalar-data-table tr > td:first-child > span { padding-left: 40px !important; }
        /* Body: content-type bar and code start under the "Body" title too. */
        .response-section-content-body .box-content.border-y { padding-left: 34px !important; }
        .response-section-content-body .scalar-code-block { padding-left: 24px !important; }
        /* Large bodies use a plain, virtualised view: notice bar + absolutely positioned text. */
        .response-body-virtual .font-code.rounded-t { padding-left: 34px !important; }
        .response-body-virtual .scalar-virtual-text { padding-left: 0 !important; }
        .response-body-virtual .scalar-virtual-text-content { left: 34px !important; }
        .scalar-card, .scalar-codeblock-pre { border-radius: 14px !important; }
      `,
    });
    });
  </script>
</body>
</html>
