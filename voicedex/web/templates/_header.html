{% set path = request.url.path %}
<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="/" aria-label="{{ site_name }} home">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#f5a524"/><rect x="10.0" y="13" width="6" height="38" rx="3" fill="#120c02"/><rect x="19.5" y="25" width="6" height="26" rx="3" fill="#120c02"/><rect x="29.0" y="38" width="6" height="13" rx="3" fill="#120c02"/><rect x="38.5" y="25" width="6" height="26" rx="3" fill="#120c02"/><rect x="48.0" y="13" width="6" height="38" rx="3" fill="#120c02"/></svg>
      <span>{{ site_name }}</span>
    </a>
    <nav class="nav-links" aria-label="Main">
      <a href="/models" {% if path.startswith('/models') %}aria-current="page"{% endif %}>Models</a>
      <a href="/voices" {% if path.startswith('/voices') %}aria-current="page"{% endif %}>Voices</a>
      <a href="/providers" class="nav-providers" {% if path.startswith('/providers') %}aria-current="page"{% endif %}>Providers</a>
      <a href="/docs" {% if path.startswith('/docs') %}aria-current="page"{% endif %}>API</a>
    </nav>
    <form class="jump" action="/search" role="search" data-palette-trigger>
      <label for="jump-q" class="visually-hidden">Search models, voices, providers, languages and features</label>
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="jump-q" name="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
      <kbd aria-hidden="true">⌘K</kbd>
    </form>
    <a class="gh-link" href="https://github.com/chandradot99/voicedex" rel="noopener" aria-label="Voicedex on GitHub" title="Source and data on GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
    <button type="button" class="theme-toggle" aria-label="Switch to light theme" title="Switch theme">
      <svg viewBox="0 0 16 16" aria-hidden="true" class="i-sun"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg>
      <svg viewBox="0 0 16 16" aria-hidden="true" class="i-moon"><path d="M13.5 9.6A5.5 5.5 0 0 1 6.4 2.5a5.5 5.5 0 1 0 7.1 7.1z"/></svg>
    </button>
    <script>
      (function () {
        var b = document.currentScript.previousElementSibling, root = document.documentElement;
        var cur = function () { return root.dataset.theme === "light" ? "light" : "dark"; };
        var sync = function () { var t = cur(); b.dataset.current = t; b.setAttribute("aria-label", "Switch to " + (t === "dark" ? "light" : "dark") + " theme"); };
        b.addEventListener("click", function () {
          var next = cur() === "dark" ? "light" : "dark";
          root.dataset.theme = next;
          try { localStorage.setItem("theme", next); } catch (e) {}
          sync();
          document.dispatchEvent(new CustomEvent("themechange", { detail: next }));
        });
        sync();
      })();
    </script>
    <a class="nav-compare" href="/compare" {% if path.startswith('/compare') %}aria-current="page"{% endif %}><svg viewBox="0 0 16 16" aria-hidden="true" class="i-compare"><rect x="2" y="3" width="4.5" height="10" rx=".5"/><rect x="9.5" y="3" width="4.5" height="10" rx=".5"/></svg><span class="nav-compare-label">Compare</span><span id="compare-count" class="nav-count" aria-label="models selected"></span></a>
  </div>
</header>
