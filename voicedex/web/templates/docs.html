<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API reference | {{ site_name }}</title>
  <meta name="description" content="Free, read-only REST API for speech-to-text, text-to-speech and speech-to-speech models and voices: languages, features, prices and shutdown dates.">
  <meta name="theme-color" content="#111113">
  <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <meta property="og:title" content="API reference | {{ site_name }}">
  <meta property="og:description" content="Free, read-only REST API for speech-to-text, text-to-speech and speech-to-speech models and voices.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site_name }}">
  <meta property="og:url" content="{{ site_url }}/docs">
  <meta property="og:image" content="{{ site_url }}/static/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{ site_url }}/docs">
  {% include "_favicon.html" %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Site CSS goes into a low-priority cascade layer here: Scalar's styles live in layers declared
       later, so they win inside the reference (our button/heading rules must not leak into it), while
       the site header below still gets its look. -->
  <!-- No white flash: the reference's base stylesheet paints a white page until it mounts; these unlayered
       rules keep our theme background from the first frame. Start fetching the spec right away, in
       parallel with the reference script. -->
  <style>
    html, body { background: #111113 !important; color: #ededea; }
    html[data-theme="light"], html[data-theme="light"] body { background: #f7f7f5 !important; color: #18181b; }
  </style>
  <link rel="preload" href="/openapi.json" as="fetch" crossorigin="anonymous">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <style>
    @layer site;
    @import url("/static/site.css?v={{ asset_v() }}") layer(site);
  </style>
  <style>
    body { min-height: 100vh; }
    .docs-page .site-header { z-index: 100; }
    .docs-page { display: block; }
    .docs-page .jump kbd { display: none; }   /* here ⌘K opens the reference's own search */
    #scalar-docs:not(:empty) + .docs-loading { display: none; }   /* placeholder only until the reference mounts */
    #scalar-docs { --scalar-custom-header-height: 57px; }
  </style>
</head>
<body class="docs-page">
  <a class="skip" href="#scalar-docs">Skip to the reference</a>
  {% include "_header.html" %}
  <main id="scalar-docs"></main>
  <div class="loading-block docs-loading" role="status"><span class="loader" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Loading API reference…</div>
  <script>
    // Focus rings for keyboard users only. Scalar moves focus programmatically after mouse clicks
    // (tabs, dropdown triggers), which browsers treat as :focus-visible — so track the input modality.
    (() => {
      const root = document.documentElement;
      addEventListener("pointerdown", () => root.classList.add("using-pointer"), true);
      addEventListener("keydown", (e) => { if (e.key === "Tab") root.classList.remove("using-pointer"); }, true);
    })();

    // API client: Scalar's "Clear" deletes every query-parameter row (documented ones included). Make it a
    // "Reset": parameters with a documented default get it back (and stay enabled); the rest are emptied and
    // disabled; rows are kept. Defaults are read from the OpenAPI document.
    (() => {
      const isQueryClear = (btn) => btn && btn.textContent.trim().match(/^(Clear|Reset)$/) &&
        /^Query Parameters/.test(btn.closest(".group\\/collapse")?.textContent.trim() || "");
      // Which operation is open: the title in the request panel's own header (the client's sidebar lists every
      // operation, so searching the whole panel would pick the wrong one).
      const defaultsFor = (queryBtn) => {
        const spec = window.__apiSpec; if (!spec) return {};
        const ops = Object.values(spec.paths).map((p) => p.get).filter(Boolean);
        const summaries = new Set(ops.map((o) => o.summary));
        const panel = queryBtn.closest(".request-section-content")?.closest("section");
        const heading = panel && [...panel.querySelectorAll("*")].find((e) => e.childElementCount === 0 &&
          summaries.has(e.textContent.trim()) && !e.closest(".request-section-content"));
        const op = heading && ops.find((o) => o.summary === heading.textContent.trim());
        if (!op) return {};
        return Object.fromEntries((op.parameters || []).filter((x) => x.in === "query")
          .map((x) => [x.name, x.schema && x.schema.default !== undefined ? String(x.schema.default) : null]));
      };
      const setText = (editor, text) => {
        // Select the editor's text explicitly (selectAll depends on focus timing) and replace it via insertText,
        // which goes through the editor's input handling so Scalar's state updates; "" clears it.
        editor.focus();
        const range = document.createRange(); range.selectNodeContents(editor);
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
        document.execCommand("insertText", false, text);
        editor.blur();
      };
      document.addEventListener("click", (e) => {
        const btn = e.target.closest(".scalar-client button");
        if (!isQueryClear(btn)) return;
        e.preventDefault(); e.stopPropagation();
        const defaults = defaultsFor(btn);
        const sectionOf = () => [...document.querySelectorAll(".scalar-client .group\\/collapse")]
          .find((el) => /^Query Parameters/.test(el.textContent.trim()));
        const rowOf = (name) => [...(sectionOf()?.querySelectorAll("tr") || [])]
          .find((tr) => tr.querySelectorAll("td")[1]?.textContent.trim() === name);
        const tick = () => new Promise((r) => setTimeout(r, 30));
        // Run after the click completes, one row at a time, re-finding rows (Scalar re-renders as values change).
        setTimeout(async () => {
          for (const [name, def] of Object.entries(defaults)) {
            let tr = rowOf(name); if (!tr) continue;
            const editor = tr.querySelectorAll("td")[2]?.querySelector("[contenteditable]");
            if (editor && (editor.textContent || "") !== (def || "")) { setText(editor, def || ""); await tick(); }
            tr = rowOf(name);
            const cb = tr?.querySelector('input[type="checkbox"]');
            if (cb && cb.checked !== Boolean(def)) { cb.click(); await tick(); }
          }
        }, 0);
      }, true);
      // Label the button for what it now does.
      new MutationObserver(() => {
        document.querySelectorAll(".scalar-client button").forEach((b) => {
          if (b.textContent.trim() === "Clear" && isQueryClear(b)) {
            const t = [...b.childNodes].find((n) => n.nodeType === 3 && n.textContent.trim() === "Clear");
            if (t) t.textContent = "Reset"; else if (b.childElementCount === 0) b.textContent = "Reset";
          }
        });
        // Scalar's own hover tooltip for the button describes the old behaviour; the button needs none.
        document.querySelectorAll(".scalar-tooltip").forEach((t) => {
          if (t.textContent.trim() === "Clear optional parameters") t.style.display = "none";   // label says it all
        });
      }).observe(document.body, { childList: true, subtree: true });
    })();

    // Parameter info ("ⓘ") popovers open on hover, not click (mouse only; touch keeps tap-to-open).
    // Scalar renders them as click-toggled popovers, so hover drives the same toggle; a short grace period
    // lets the pointer move from the icon onto the popover.
    (() => {
      const SEL = 'button[aria-label="More Information"]';
      let openBtn = null, closeTimer = null;
      const isOpen = (b) => b.getAttribute("aria-expanded") === "true";
      const close = () => { if (openBtn && isOpen(openBtn)) openBtn.click(); openBtn = null; };
      const cancelClose = () => { clearTimeout(closeTimer); closeTimer = null; };
      const scheduleClose = () => { cancelClose(); closeTimer = setTimeout(close, 180); };

      document.addEventListener("pointerover", (e) => {
        if (e.pointerType !== "mouse") return;
        const btn = e.target.closest(SEL);
        if (btn) {
          cancelClose();
          if (openBtn && openBtn !== btn) close();
          document.documentElement.classList.add("using-pointer");   // opening focuses the icon; no keyboard ring
          if (!isOpen(btn)) { btn.click(); }
          openBtn = btn;
          return;
        }
        if (openBtn && e.target.closest(".z-context")) cancelClose();      // pointer is on the popover
      });
      document.addEventListener("pointerout", (e) => {
        if (e.pointerType !== "mouse" || !openBtn) return;
        const to = e.relatedTarget;
        if (to && (to.closest(SEL) === openBtn || to.closest(".z-context"))) return;
        if (e.target.closest(SEL) || e.target.closest(".z-context")) scheduleClose();
      });
      // A real mouse click on an icon that hover already opened shouldn't toggle it shut.
      document.addEventListener("click", (e) => {
        const btn = e.target.closest(SEL);
        if (btn && e.isTrusted && e.pointerType === "mouse" && btn === openBtn && isOpen(btn)) {
          e.preventDefault(); e.stopPropagation();
        }
      }, true);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.76.4/dist/browser/standalone.js"></script>
  <script>
    // Fill the real host into the quickstart examples and server list.
    window.__theme = document.documentElement.dataset.theme === "light" ? "light" : "dark";
    document.addEventListener("themechange", () => location.reload());     // Scalar's own dark/light state is set at mount
    fetch("/openapi.json").then((r) => r.text()).then((raw) => {
    const spec = JSON.parse(raw.replaceAll("https://<host>", location.origin));
    spec.servers = [{ url: location.origin, description: "This deployment" }];
    window.__apiSpec = spec;   // used by the API client "Reset" (parameter defaults)
    Scalar.createApiReference("#scalar-docs", {
      content: spec,
      theme: "none",
      darkMode: window.__theme === "dark",
      forceDarkModeState: window.__theme,
      hideDarkModeToggle: true,
      hideClientButton: true,        // the sidebar "Open API Client" opens client.scalar.com (external); in-page "Test Request" stays
      showDeveloperTools: "never",
      agent: { disabled: true },
      hideDownloadButton: false,
      documentDownloadType: "json",
      operationTitleSource: "summary",
      hideModels: true,         // OpenAPI schema list ("Models": ModelOut…) reads as speech models here
      orderSchemaPropertiesBy: "preserve",
      withDefaultFonts: false,
      defaultOpenAllTags: true,
      showSidebar: true,
      metaData: { title: "API reference | {{ site_name }}" },
      customCss: `
        .dark-mode, .light-mode, :root {
          --scalar-font: "Geist", ui-sans-serif, system-ui, sans-serif;
          --scalar-font-code: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
          --scalar-background-1: var(--bg);
          --scalar-background-2: var(--panel);
          --scalar-background-3: var(--panel-2);
          --scalar-background-accent: color-mix(in srgb, var(--signal) 8%, transparent);
          --scalar-color-1: var(--ink);
          --scalar-color-2: var(--ink-2);
          --scalar-color-3: var(--muted);
          --scalar-color-accent: var(--signal);
          --scalar-border-color: var(--rule);
          --scalar-button-1: var(--ink);
          --scalar-button-1-color: var(--bg);
          --scalar-button-1-hover: var(--signal-fill);
          --scalar-color-green: #a3e635;
          --scalar-color-blue: #7fb4e0;
          --scalar-color-orange: #fbbf24;
          --scalar-color-red: #fb7c5c;
          --scalar-color-purple: #b79bf0;
          --scalar-radius: 2px;
          --scalar-radius-lg: 2px;
          --scalar-radius-xl: 3px;
          --scalar-sidebar-background-1: var(--bg);
          --scalar-sidebar-item-hover-background: var(--panel);
          --scalar-sidebar-item-active-background: var(--panel-2);
          --scalar-sidebar-border-color: var(--rule);
          --scalar-sidebar-color-1: var(--ink);
          --scalar-sidebar-color-2: var(--muted);
          --scalar-sidebar-color-active: var(--signal);
          --scalar-sidebar-search-background: var(--panel);
          --scalar-sidebar-search-border-color: var(--rule-2);
        }
        .light-mode {        /* HTTP method colours that stay readable on a light page */
          --scalar-color-green: #3d7a12;
          --scalar-color-blue: #1f5f9e;
          --scalar-color-orange: #9a5b00;
          --scalar-color-red: #b4321f;
          --scalar-color-purple: #6b46b8;
        }
        .scalar-api-reference.references-layout { background: var(--bg); }
        /* API client ("Test Request"): a raised panel over a dimmed, blurred page.
           !important: Scalar's own theme selectors are more specific than customCss. */
        .scalar-container.scalar-client--open { background: var(--backdrop) !important; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .scalar.scalar-app.z-overlay { background: transparent !important; }
        .scalar-client.scalar-app-layout, .scalar-client.scalar-app-layout * {
          --scalar-background-1: var(--panel) !important;
          --scalar-background-2: var(--panel-2) !important;
          --scalar-background-3: var(--rule) !important;
          --scalar-border-color: var(--rule-2) !important;
        }
        .scalar-client.scalar-app-layout {
          background: var(--panel) !important; border: 1px solid var(--control) !important; border-radius: 2px; overflow: hidden;
          box-shadow: 0 40px 140px -20px var(--shadow) !important;
        }
        .section-header, .section .section-header-label, h1.section-header { letter-spacing: -0.025em; }
        .introduction-section h1, .section-header.tight { font-weight: 600; }
        .section.introduction-section { padding-top: 12px !important; }   /* title lines up with the sidebar's search box */
        /* Version badges sit on the title line, at the far right. */
        .introduction-section .section-content { display: grid !important; grid-template-columns: max-content 1fr; column-gap: 14px; row-gap: 12px; align-items: center; }
        .introduction-section .section-content > div.flex:first-child { grid-column: 2; grid-row: 1; justify-self: end; }
        .introduction-section .section-content > .section-header-wrapper { grid-column: 1; grid-row: 1; width: max-content; }
        .introduction-section .section-content > .section-header-wrapper .section-header { margin-bottom: 0 !important; }
        .introduction-section .section-content > :not(div.flex:first-child):not(.section-header-wrapper) { grid-column: 1 / -1; }
        /* Floating layers (menus, listboxes, search dialog, tooltips) must read as raised above
           whatever they cover: lighter surface, visible edge, real shadow. */
        .z-context > div, [role="tooltip"]:not(.scalar-tooltip), .scalar-modal {
          background: var(--panel-2) !important;
          box-shadow: 0 0 0 1px var(--rule-2), 0 24px 60px -12px var(--shadow) !important;
        }
        /* Scalar's hover tooltips are already a rounded pill; the wrapper stays invisible. */
        .scalar-tooltip { background: transparent !important; box-shadow: none !important; }
        /* Tooltips and the parameter-info popover: same 8px radius as the site's other small surfaces. */
        .scalar-tooltip::before { border-radius: 2px !important; }
        .z-context > div.rounded-xl { border-radius: 2px !important; }
        .z-context > div.rounded-xl:has(> div.text-xxs) { padding: 0 !important; }
        .z-context > div.rounded-xl > div.text-xxs { border-radius: 2px !important; padding: 6px 10px !important; }
        .z-context > div.rounded-xl > div.text-xxs .markdown { line-height: 1.45 !important; }
        /* Search dialog (⌘K) and other modals: dim + blur the page; mark the keyboard selection. */
        .scalar-modal-layout { background: var(--backdrop) !important; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .scalar-modal a[aria-selected="true"], .scalar-modal a:hover { background: var(--rule) !important; box-shadow: inset 2px 0 0 var(--signal); }
        .z-context [role="option"]:hover, .z-context [role="option"][data-headlessui-state~="active"],
        .z-context [role="menuitem"]:hover { background: var(--rule) !important; }
        .z-context [role="option"] .shadow-border, .z-context [role="menuitem"] .shadow-border { box-shadow: inset 0 0 0 1px var(--control) !important; }
        .z-context [role="option"][aria-selected="true"] .shadow-border { box-shadow: inset 0 0 0 1px var(--signal) !important; color: var(--signal) !important; }
        .z-context ul[role="listbox"] { border-color: var(--rule-2) !important; }
        /* Intro "Client Libraries" card keeps Scalar's own design; only the focus ring Scalar leaves on a
           clicked tab is removed (keyboard focus still shows one). */
        html.using-pointer #scalar-docs *:focus, html.using-pointer .scalar-app *:focus { outline: 0 !important; }
        /* Intro "Client Libraries" card hidden: it duplicates the language picker on every code example, and
           the name suggests SDKs we don't publish. Bring it back if official packages ship. */
        .scalar-reference-intro-clients { display: none !important; }
        /* Server card hidden too: one fixed server; the base URL is in the quickstart and every example. */
        .scalar-reference-intro-server { display: none !important; }
        /* With both intro cards hidden the right column is empty: give the introduction the full width. */
        .introduction-section .section-columns > .section-column:not(:first-child) { display: none !important; }
        .introduction-section .section-columns > .section-column:first-child { flex: 1 1 100% !important; max-width: none !important; width: 100% !important; }
        /* Sidebar, in the site's own pattern (top nav / tabs): active = rounded fill + white text, hover = a
           quieter fill, no accent bars. Scalar draws the nesting line inside each link, so the fill is a layer
           behind the text that starts right of that line for nested items instead of painting over it. */
        a.peer\\/button { position: relative; isolation: isolate; border-radius: 2px !important; padding: 7px 10px !important; background: transparent !important; box-shadow: none !important; }
        a.peer\\/button::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 2px; background: transparent; }
        a.peer\\/button:has(.scalar-sidebar-indent-border)::before { left: 24px; }
        /* Nested items: 10px between the fill's left edge and the text, same inset as group headings. */
        a.peer\\/button:has(.scalar-sidebar-indent-border) .group\\/button-label { padding-left: 4px; }
        a.peer\\/button:hover::before { background: var(--panel); }
        a.peer\\/button[aria-current="page"]::before { background: var(--panel-2); }
        a.peer\\/button:hover, a.peer\\/button[aria-current="page"] { color: var(--ink) !important; }
        a.peer\\/button[aria-current="page"] { font-weight: 500 !important; }
        .group\\/group-button > a.peer\\/button { color: var(--ink) !important; font-weight: 600 !important; }
        a.peer\\/button .sidebar-heading-type { opacity: 0.7; }
        /* Scalar overlays a brighter, offset segment on the nesting line beside the current item; the fill already
           marks it, so drop the segment and keep one continuous line. */
        .bg-sidebar-indent-border-active { display: none !important; }
        /* The line is drawn per item and the pieces overlap by a few px; a translucent colour doubles at each overlap
           (visible joints), so use the equivalent opaque colour. */
        .scalar-sidebar-indent-border { background: var(--rule) !important; width: 1px !important; }
        /* API client: larger section headings (Cookies, Headers, Query Parameters, Body…) and panel titles. */
        .scalar-client h3,
        .response-section-content button.box-content.max-h-8 { font-size: 15.5px !important; font-weight: 600 !important; line-height: 22px !important; }
        .scalar-client .request-response-header { font-size: 15px !important; font-weight: 600 !important; }
        /* Request panel: Scalar puts an empty growing spacer before "Code Snippet", pinning it to the bottom with a
           gap when sections are collapsed. Remove only the spacer — the container keeps the full panel height, so
           popovers inside it (the code-language picker) still have room. */
        .request-section-content .flex.grow:empty { display: none !important; }
        /* API client "include" checkboxes: a real checkbox look. Unchecked = visible empty box (was a near-invisible
           check that read as a glitch); checked = amber box with a dark check; disabled (empty Key rows) = dimmed. */
        .scalar-client input.peer[type="checkbox"] + div > div.rounded {
          opacity: 1 !important; width: 16px !important; height: 16px !important; border-radius: 2px !important;
          border: 1.5px solid var(--control) !important; background: transparent;
        }
        .scalar-client input.peer[type="checkbox"]:not(:checked) + div svg { opacity: 0 !important; }
        .scalar-client input.peer[type="checkbox"]:checked + div { color: var(--signal-ink) !important; }
        .scalar-client input.peer[type="checkbox"]:checked + div > div.rounded { background: var(--signal-fill) !important; border-color: var(--signal-fill) !important; }
        .scalar-client input.peer[type="checkbox"]:checked + div svg { position: relative; z-index: 1; }
        .scalar-client input.peer[type="checkbox"]:not(:checked):not(:disabled):hover + div > div.rounded { border-color: var(--ink-2) !important; }
        .scalar-client input.peer[type="checkbox"]:checked:hover + div > div.rounded { background: var(--signal-fill) !important; border-color: var(--signal-fill) !important; }
        .scalar-client input.peer[type="checkbox"]:disabled + div > div.rounded { opacity: 0.35 !important; }
        /* Response panel: indent header/cookie keys to sit under their section titles,
           matching the request panel (whose rows start after a checkbox column). */
        .response-section-content .scalar-data-table tr > td:first-child > span { padding-left: 40px !important; }
        /* Body: content-type bar and code start under the "Body" title too. */
        .response-section-content-body .box-content.border-y { padding-left: 34px !important; }
        .response-section-content-body .scalar-code-block { padding-left: 24px !important; }
        /* Large bodies use a plain, virtualised view: notice bar + absolutely positioned text. */
        .response-body-virtual .font-code.rounded-t { padding-left: 34px !important; }
        .response-body-virtual .scalar-virtual-text { padding-left: 0 !important; }
        .response-body-virtual .scalar-virtual-text-content { left: 34px !important; }
        .scalar-card, .scalar-codeblock-pre { border-radius: 2px !important; }
        /* Datasheet shapes: no pills (version badge, content-type chip, schema toggle). */
        .badge.rounded-2xl, .selected-content-type, .scalar-card-checkbox-input, .scalar-card-checkbox-checkmark { border-radius: 2px !important; }
      `,
    });
    });
  </script>
</body>
</html>
